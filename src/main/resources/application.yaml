userservice:
  base-url: ${USER_SERVICE_BASE_URL}
  connect-timeout-ms: ${USER_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${USER_SERVICE_READ_TIMEOUT_MS:3000}

spring:
  application:
    name: orderservice

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate


  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
