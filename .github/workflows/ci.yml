name: CI

on:
  push:
    branches:
      - master
      - ORDER-0
  pull_request:
    branches:
      - master
      - ORDER-0

jobs:
  build-test-analyze:
    name: Build, Test, Analyze
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderservice
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d orderservice"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/orderservice
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_BASE_URL: http://localhost:8081
      USER_SERVICE_CONNECT_TIMEOUT_MS: 2000
      USER_SERVICE_READ_TIMEOUT_MS: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B -DskipTests clean package

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw -B test

      - name: Code Analysis
        run: ./mvnw -B verify

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build-test-analyze
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image repo
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orderservice" >> $GITHUB_ENV

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: Build and Push Docker image (Push)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
